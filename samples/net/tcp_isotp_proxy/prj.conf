# nothing here
CONFIG_NETWORKING=y
CONFIG_ETH_STM32_HAL=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_POSIX_API=y

CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_LOG=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_LOG=y
CONFIG_GPIO=y

CONFIG_TCP_CMD_HANDLER=y
CONFIG_TCP_CMD_HANDLER_LOG_LEVEL_DBG=y

# Enable CAN bus support and ISOTP protocol
CONFIG_CAN=y
CONFIG_CAN_MAX_FILTER=8

CONFIG_ISOTP=y
CONFIG_CAN_ISOTP_PROXY=y
CONFIG_CAN_ISOTP_PROXY_LOG_LEVEL_DBG=y
# We have two receiving contexts that are bound to a single address.
# CONFIG_ISOTP_RX_SF_FF_BUF_COUNT=2
CONFIG_CAN_ISOTP_PROXY_LOOPBACK=y

CONFIG_TX_MSG_QUEUE=y
CONFIG_TX_MSG_QUEUE_LOG_LEVEL_DBG=y

CONFIG_TCP_LINK=y
CONFIG_TCP_LINK_LOG_LEVEL_DBG=y
